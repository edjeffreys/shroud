[package]
name = "shroud-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Separate workspace: keeps nightly builds off the main lockfile.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "1"
serde_json = "1"
shroud-core = { path = "../crates/core" }

[[bin]]
name = "input_decode"
path = "fuzz_targets/input_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "protocol_message"
path = "fuzz_targets/protocol_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "shell_tracker"
path = "fuzz_targets/shell_tracker.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config_parse"
path = "fuzz_targets/config_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "api_request"
path = "fuzz_targets/api_request.rs"
test = false
doc = false
bench = false
