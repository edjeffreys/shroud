# Builds shroud natively for each target and publishes it.
#
# - A `v*` tag publishes a release, `shroud-<version>-<target>.tar.gz` for each target, and
#   updates Formula/shroud.rb in edjeffreys/homebrew-tap to match.
# - CI passing on `main` replaces the `dev` prerelease: `shroud-dev-<target>.tar.gz`, always
#   the newest main, reporting a version like `0.2.0-dev.12+g3f9c2ab`.
# - A manual run, or a PR that changes this file, builds the same artifacts and publishes nothing.
#
# Each target builds on its own runner because crates/vt/build.rs builds libghostty-vt for
# the machine it runs on. Linux builds on Ubuntu 22.04 so the binary runs on glibc 2.35+.
name: release

on:
  push:
    tags: ["v*"]
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  pull_request:
    paths: [.github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  # A newer main supersedes an older dev build; releases always finish.
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  version:
    # workflow_run fires on every CI result, including a fork's PR from a branch named main;
    # only a green push to this repository's main makes a dev build.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.v.outputs.sha }}
      version: ${{ steps.v.outputs.version }}
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@v7
        with:
          # workflow_run runs on main's head, which may have moved on; build what CI checked.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: v
        name: Work out the version
        run: |
          base=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$base" ]]; then
              echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml's version $base"
              exit 1
            fi
            echo "version=$base" >> "$GITHUB_OUTPUT"
            echo "name=shroud-$base" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Commits since the last release tag, or since the start before the first one.
          if last=$(git describe --tags --match 'v[0-9]*' --abbrev=0 2>/dev/null); then
            n=$(git rev-list --count "$last..HEAD")
            if [[ "$last" == "v$base" ]]; then
              echo "::warning::Cargo.toml still says $base, the version $last released; bump it so dev builds sort after the release"
            fi
          else
            n=$(git rev-list --count HEAD)
          fi
          echo "version=$base-dev.$n+g${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "name=shroud-dev" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, runner: macos-15 }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-22.04-arm }
    runs-on: ${{ matrix.runner }}
    env:
      NAME: ${{ needs.version.outputs.name }}-${{ matrix.target }}
      VERSION: ${{ needs.version.outputs.version }}
      # What `shroud --version` reports; crates/shroud/src/main.rs falls back to Cargo.toml.
      SHROUD_VERSION: ${{ needs.version.outputs.version }}
      # Rust's default for these targets; keeps the binary running on older macOS.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            target
          key: release-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'crates/vt/build.rs') }}
      - run: cargo build --release --locked -p shroud --target ${{ matrix.target }}
      - name: Check the binary runs and reports its version
        run: |
          bin=target/${{ matrix.target }}/release/shroud
          "$bin" --version
          test "$("$bin" --version)" = "shroud $VERSION"
          if [[ "$RUNNER_OS" == macOS ]]; then otool -L "$bin"; otool -l "$bin" | grep -A3 LC_BUILD_VERSION; else ldd "$bin"; fi
      - name: Package
        run: |
          mkdir "$NAME"
          cp target/${{ matrix.target }}/release/shroud LICENSE README.md "$NAME/"
          tar -czf "$NAME.tar.gz" "$NAME"
          if command -v sha256sum >/dev/null; then sha256sum "$NAME.tar.gz"; else shasum -a 256 "$NAME.tar.gz"; fi > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.NAME }}
          path: |
            ${{ env.NAME }}.tar.gz
            ${{ env.NAME }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # A draft first, published only once every asset is uploaded, so a release never
      # appears with some of its files missing.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "shroud ${{ needs.version.outputs.version }}" --generate-notes
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" *.tar.gz *.sha256 SHA256SUMS
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # Writes Formula/shroud.rb in edjeffreys/homebrew-tap from this release's checksums.
  # HOMEBREW_TAP_TOKEN: a fine-grained token with Contents read/write on that repository only.
  homebrew:
    needs: [version, publish]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Update the formula
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          sum() { cut -d' ' -f1 "dist/shroud-$VERSION-$1.tar.gz.sha256"; }
          url() { echo "https://github.com/$REPO/releases/download/v$VERSION/shroud-$VERSION-$1.tar.gz"; }
          git clone -q "https://x-access-token:$TOKEN@github.com/edjeffreys/homebrew-tap.git" tap
          mkdir -p tap/Formula
          if [[ ! -f tap/README.md ]]; then
            printf "# edjeffreys/tap\n\nHomebrew formulae, written by each project's release workflow.\n\n\`\`\`sh\nbrew install edjeffreys/tap/shroud          # the latest release\nbrew install --HEAD edjeffreys/tap/shroud   # main, built from source\n\`\`\`\n" > tap/README.md
          fi
          cat > tap/Formula/shroud.rb <<RUBY
          # Written by shroud's release workflow; changes here are overwritten at the next release.
          class Shroud < Formula
            desc "Terminal multiplexer for modern terminals, built on libghostty-vt"
            homepage "https://github.com/$REPO"
            version "$VERSION"
            license "MIT"

            on_macos do
              on_arm do
                url "$(url aarch64-apple-darwin)"
                sha256 "$(sum aarch64-apple-darwin)"
              end
              on_intel do
                url "$(url x86_64-apple-darwin)"
                sha256 "$(sum x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "$(url aarch64-unknown-linux-gnu)"
                sha256 "$(sum aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "$(url x86_64-unknown-linux-gnu)"
                sha256 "$(sum x86_64-unknown-linux-gnu)"
              end
            end

            head do
              url "https://github.com/$REPO.git", branch: "main"
              depends_on "rust" => :build
              depends_on "zig" => :build
            end

            def install
              if build.head?
                # Homebrew's sandbox allows writes only inside the build directory.
                ENV["ZIG_GLOBAL_CACHE_DIR"] = buildpath/".zig-cache"
                system "cargo", "install", *std_cargo_args(path: "crates/shroud")
              else
                bin.install "shroud"
              end
            end

            test do
              assert_match "shroud ", shell_output("#{bin}/shroud --version")
            end
          end
          RUBY
          cat tap/Formula/shroud.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/shroud.rb README.md
          git diff --cached --quiet || git commit -m "shroud $VERSION"
          git push origin HEAD:main

  publish-dev:
    if: github.event_name == 'workflow_run'
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # Replaced whole: deleting the old release and its tag, then creating both afresh at
      # this commit, so the `dev` tag always marks what the binaries were built from.
      - name: Replace the dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.version.outputs.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS
          gh release delete dev --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          notes="The newest \`main\`, rebuilt whenever CI passes on it: $VERSION, from $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$SHA. Not a release; for those, see the latest release."
          gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --target "$SHA" \
            --title "shroud dev ($VERSION)" --notes "$notes" \
            *.tar.gz *.sha256 SHA256SUMS
